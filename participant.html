<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notre équipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     PERSONNALISATION
     - Les 9 personnes sont définies dans le tableau JS "PEOPLE"
       tout en bas du fichier (nom, rôle, bio, initiales, teinte).
     - Remplacez "initials" par une vraie photo en changeant le
       bloc .photo (voir commentaire "REMPLACER PAR UNE PHOTO").
     ============================================================ */

  :root{
    --bg:#08080c;
    --fg:#f5f4f2;
    --fg-dim:rgba(245,244,242,.62);
    --line:rgba(245,244,242,.22);
    /* agrandir/rétrécir les images : modifier --card-w et --card-h */
    --card-w:552px;
    --card-h:628px;
    --gap:44px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--fg);
    overflow-x:hidden;
  }

  .team{
    position:relative;
    width:100%;
    min-height:100vh;
    background:var(--bg);
    overflow:hidden;
    isolation:isolate;
  }

  /* -------- fond : halo aurore + grain -------- */
  .bg-aurora{
    position:absolute; inset:-20%;
    pointer-events:none;
    z-index:0;
    background:
      radial-gradient(38% 55% at 4% 30%, rgba(150,120,255,.28), transparent 70%),
      radial-gradient(30% 45% at 96% 60%, rgba(255,120,190,.22), transparent 70%),
      radial-gradient(45% 60% at 50% 100%, rgba(90,140,255,.18), transparent 70%);
    filter:blur(40px);
    animation:aurora-drift 26s ease-in-out infinite alternate;
  }
  @keyframes aurora-drift{
    from{ transform:translate3d(0,0,0) scale(1); }
    to{ transform:translate3d(1.5%, -1.5%, 0) scale(1.04); }
  }
  .bg-noise{
    position:absolute; inset:0; z-index:0;
    pointer-events:none;
    opacity:.05;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* -------- ligne : en-tête + piste — tout le bloc se glisse ensemble -------- */
  .team-row{
    position:relative;
    z-index:3;
    display:flex;
    align-items:center;
    min-height:100vh;
    width:max-content;
    cursor:grab;
    will-change:transform;
  }
  .team-row.dragging{ cursor:grabbing; }

  .team-intro{
    position:relative;
    flex:0 0 auto;
    padding:0 0 0 15vw;
    box-sizing:border-box;
  }
  .team-intro h2{
    font-family: "Sulphur Point", sans-serif;
    font-weight:500;
    font-size:clamp(40px, 6vw, 68px);
    line-height:1.02;
    margin:0 0 80px 0;
    letter-spacing:-.02em;
  }
  .team-intro p{
    font-size:20px;
    line-height:1.55;
    color:var(--fg-dim);
    max-width:600px;
    margin:0 90px;
  }

  /* -------- piste (fait maintenant partie du bloc glissé en entier) -------- */
  .track-viewport{
    position:relative;
    flex:0 0 auto;
  }

  .track{
    list-style:none;
    display:flex;
    align-items:center;
    gap:var(--gap);
    margin:0;
    padding:0 6vw 0 3vw;
    width:max-content;
    will-change:transform;
    touch-action:pan-y;
  }

  .card{
    flex:0 0 var(--card-w);
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    align-self:flex-start;
    user-select:none;
    -webkit-user-select:none;
  }

  .photo{
    width:var(--card-w);
    height:var(--card-h);
    border-radius: 40px;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(circle at 32% 22%, hsl(var(--hue) 70% 72%) 0%, hsl(calc(var(--hue) + 35) 55% 34%) 55%, #101014 100%);
    background-size:cover;
    background-position:center;
    filter:grayscale(.82) contrast(1.04);
    transition:filter .55s ease;
  }
  /* Si p.img est défini dans PEOPLE (voir plus bas), le JS ajoute
     la classe .has-photo et pose background-image directement en
     style inline : le dégradé ci-dessus ne sert alors que de
     couleur de secours pendant le chargement de l'image. */
  .photo.has-photo .initials{ display:none; }

  .photo .initials{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-size:64px;
    font-weight:500;
    color:rgba(255,255,255,.28);
    letter-spacing:.02em;
  }
  .photo .sweep{
    position:absolute; inset:-40%;
    background:linear-gradient(115deg,
      transparent 30%,
      hsl(var(--hue) 90% 65% / .55) 48%,
      hsl(calc(var(--hue) + 50) 90% 65% / .35) 56%,
      transparent 72%);
    background-size:260% 260%;
    background-position:0% 0%;
    mix-blend-mode:color-dodge;
    opacity:0;
    transition:opacity .5s ease, background-position .9s ease;
    pointer-events:none;
  }
  .card:hover .photo, .card.active .photo{ filter:grayscale(0) contrast(1.02); }
  .card:hover .photo .sweep, .card.active .photo .sweep{
    opacity:1;
    background-position:100% 100%;
  }

  .meta{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-top:22px;
  }
  .meta h3{
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
    font-size:23px;
    margin:0;
    letter-spacing:-.01em;
  }
  .meta .role{
    font-size:11.5px;
    letter-spacing:.02em;
    color:var(--fg-dim);
    white-space:nowrap;
  }

  .divider{
    width:100%;
    height:1px;
    background:var(--line);
    margin-top:16px;
  }

  .bio{
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:max-height .55s cubic-bezier(.2,.8,.2,1), opacity .4s ease, margin-top .55s ease;
  }
  .card.active .bio{
    max-height:280px;
    opacity:1;
    margin-top:16px;
  }
  .bio p{
    margin:0;
    font-size:25px;
    line-height:1.6;
    color:var(--fg-dim);
    max-width:552px;
  }

  .card:focus-visible{ outline:2px solid #fff; outline-offset:6px; }

  /* -------- curseur personnalisé (pointeurs fins uniquement) -------- */
  .cursor-chip{
    position:fixed;
    z-index:50;
    left:0; top:0;
    width:84px; height:84px;
    border-radius:50%;
    background:#f5f4f2;
    color:#0c0c0f;
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif;
    font-size:10.5px;
    font-weight:500;
    letter-spacing:.06em;
    text-transform:uppercase;
    pointer-events:none;
    opacity:0;
    transform:translate(-50%,-50%) scale(.7);
    transition:opacity .25s ease, transform .25s ease;
    gap:8px;
  }
  .cursor-chip.visible{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  .cursor-chip .dash{ opacity:.45; font-size:13px; }

  @media (pointer:coarse){
    .cursor-chip{ display:none; }
    .team{ overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; }
    .team-row{ cursor:auto; }
  }

  @media (max-width:820px){
    :root{ --card-w:198px; --card-h:258px; --gap:28px; }
    .team{ overflow-x:hidden; }
    .team-row{ flex-direction:column; align-items:flex-start; min-height:0; width:100%; padding-top:9vh; }
    .team-intro{ width:100%; padding:0 6vw; }
    .team-intro p{ max-width:none; margin:0; }
    .track-viewport{ width:100%; margin-top:6vh; padding-bottom:10vh; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .track{ padding:0 6vw; }
    .bio p{ max-width:190px; }
  }

  @media (prefers-reduced-motion:reduce){
    .bg-aurora{ animation:none; }
    .card .photo, .bio{ transition-duration:.01s; }
  }
</style>
</head>
<body>

<section class="team" id="team">
  <div class="bg-aurora" aria-hidden="true"></div>
  <div class="bg-noise" aria-hidden="true"></div>

  <div class="team-row" id="teamRow">
    <header class="team-intro">
      <h2>Rencontrer <br>les participant·es</h2>
      <p>Découvrez les profils des participantes et participants d'Initiative avenir, leurs parcours, leurs compétences et leurs ambitions professionnelles.</p>
    </header>

    <div class="track-viewport">
      <ul class="track" id="track"></ul>
    </div>
  </div>

  <div class="cursor-chip" id="cursorChip">
    <span class="dash" id="dashL"></span>
    <span id="cursorLabel">Glisser</span>
    <span class="dash" id="dashR"></span>
  </div>
</section>

<script>
(function(){
  "use strict";

  /* ============================================================
     DONNÉES — modifiez librement les 9 entrées ci-dessous
     ============================================================ */
  /* Pour ajouter une photo : mettez le fichier image dans le
     dossier "images/" (à côté de ce fichier html) et indiquez son
     nom dans "img" ci-dessous, ex: img:"images/camille.jpg".
     Laissez img:"" pour garder les initiales par défaut. */
  const PEOPLE = [
    { name:"--", role:"", initials:"", img:"images/test.jpg", hue:325,
      bio:"Camille pilote la vision de l'équipe et la relation avec les client·es. Elle a fondé l'agence après dix ans passés en stratégie de marque et reste impliquée sur chaque projet, du premier brief à la livraison finale." },
    { name:"--", role:"", initials:"", img:"images/test.jpg", hue:150,
      bio:"Antoine relie les objectifs d'affaires aux décisions créatives. Ancien consultant en gestion, il structure les feuilles de route et s'assure que chaque projet reste ancré dans des résultats mesurables." },
    { name:"--", role:"", initials:"", img:"images/test.jpg", hue:15,
      bio:"Léa conçoit les identités visuelles et les interfaces de l'agence. Diplômée en design graphique, elle porte une attention particulière à la typographie et aux détails d'exécution." },
    { name:"--", role:"", initials:"", img:"images/test.jpg", hue:205,
      bio:"Nathan transforme les maquettes en produits fonctionnels. Il se spécialise en développement front-end et en animations d'interface, avec un souci constant de performance." },
    { name:"--", role:"", initials:"", img:"images/test.jpg", hue:275,
      bio:"Sofia coordonne les priorités produit entre les équipes design et technique. Elle a auparavant travaillé en gestion de produit pour des plateformes SaaS en croissance." },
    { name:"--", role:"", initials:"", img:"images/test.jpg", hue:45,
      bio:"Maxime veille au bon déroulement des projets, des échéanciers aux budgets. Son parcours en gestion de projet garantit une exécution sans accroc, du démarrage à la livraison." },
    { name:"--", role:"", initials:"", img:"images/test.jpg", hue:190,
      bio:"Juliette imagine les concepts créatifs qui donnent leur ton aux campagnes de l'agence. Elle aime particulièrement les projets qui mêlent narration et expérimentation visuelle." },
    { name:"--", role:"", initials:"", img:"images/test.jpg", hue:265,
      bio:"Ilyas supervise l'architecture technique des projets numériques. Passionné par les nouvelles technologies web, il explore constamment de nouvelles façons de repousser les interfaces." },
    { name:"--", role:"", initials:"", img:"images/test.jpg", hue:340,
      bio:"Emma élabore les stratégies de visibilité et de contenu de l'agence. Elle combine analyse de données et sens du récit pour faire rayonner chaque projet auprès du bon public." }
  ];

  /* ============================================================
     CONSTRUCTION DES CARTES
     ============================================================ */
  const track = document.getElementById('track');
  const frag = document.createDocumentFragment();

  PEOPLE.forEach((p, i) => {
    const li = document.createElement('li');
    li.className = 'card';
    li.dataset.index = i;
    li.style.setProperty('--hue', p.hue);
    li.tabIndex = 0;
    li.setAttribute('role','button');
    li.setAttribute('aria-expanded','false');
    li.setAttribute('aria-label', p.name + ', ' + p.role + '. Activer pour lire la biographie.');

    const hasPhoto = !!p.img;
    const photoStyle = hasPhoto ? ' style="background-image:url(\'' + p.img + '\')"' : '';

    li.innerHTML =
      '<div class="photo' + (hasPhoto ? ' has-photo' : '') + '"' + photoStyle + '>' +
        '<span class="initials">' + p.initials + '</span>' +
        '<span class="sweep"></span>' +
      '</div>' +
      '<div class="meta"><h3>' + p.name + '</h3><span class="role">+ ' + p.role + '</span></div>' +
      '<div class="divider"></div>' +
      '<div class="bio"><p>' + p.bio + '</p></div>';

    frag.appendChild(li);
  });
  track.appendChild(frag);

  const cards = Array.from(track.querySelectorAll('.card'));

  /* ============================================================
     OUVERTURE / FERMETURE D'UNE CARTE
     ============================================================ */
  let activeCard = null;

  function setActive(card){
    if (activeCard === card) return;
    if (activeCard){
      activeCard.classList.remove('active');
      activeCard.setAttribute('aria-expanded','false');
    }
    activeCard = card;
    if (activeCard){
      activeCard.classList.add('active');
      activeCard.setAttribute('aria-expanded','true');
    }
  }

  function toggleCard(card){
    setActive(activeCard === card ? null : card);
  }

  cards.forEach(card => {
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        toggleCard(card);
      }
    });
  });

  const teamSection = document.getElementById('team');

  /* ============================================================
     CURSEUR PERSONNALISÉ (glisser / voir / fermer)
     ============================================================ */
  /* "viewport" = la zone qu'on glisse = tout le bloc .team-row
     (en-tête + piste), pour que le texte suive les cartes. */
  const viewport = document.getElementById('teamRow');
  const chip = document.getElementById('cursorChip');
  const label = document.getElementById('cursorLabel');
  const dashL = document.getElementById('dashL');
  const dashR = document.getElementById('dashR');
  const isFinePointer = window.matchMedia('(pointer: fine)').matches;

  function setChipLabel(text, withDash){
    label.textContent = text;
    dashL.textContent = withDash ? '—' : '';
    dashR.textContent = withDash ? '—' : '';
  }

  let lastPointerX = null, lastPointerY = null;

  function refreshChipLabel(){
    if (lastPointerX === null || isDragging) return;
    const el = document.elementFromPoint(lastPointerX, lastPointerY);
    const overCard = el && el.closest('.card');
    if (overCard){
      setChipLabel(overCard === activeCard ? 'Fermer' : 'Voir', false);
    } else {
      setChipLabel('Glisser', true);
    }
  }

  if (isFinePointer){
    viewport.addEventListener('pointermove', e => {
      chip.style.left = e.clientX + 'px';
      chip.style.top = e.clientY + 'px';
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;

      if (isDragging){ setChipLabel('Glisser', true); return; }
      refreshChipLabel();
    });
    viewport.addEventListener('pointerenter', () => chip.classList.add('visible'));
    viewport.addEventListener('pointerleave', () => chip.classList.remove('visible'));
  }

  /* ============================================================
     GLISSER-DÉFILER AVEC INERTIE (pointeurs fins)
     Le transform s'applique sur tout le bloc .team-row : le texte
     d'intro et les cartes se déplacent donc ensemble, au même rythme.
     ============================================================ */
  let posX = 0;          // position actuelle du bloc entier
  let minX = 0;           // borne gauche (négative)
  let isDragging = false;
  let startClientX = 0;
  let startPosX = 0;
  let lastClientX = 0;
  let lastTime = 0;
  let velocity = 0;
  let momentumFrame = null;
  let moved = 0;

  function computeBounds(){
    const rowWidth = viewport.scrollWidth;        // largeur totale (en-tête + cartes)
    const availableWidth = teamSection.clientWidth; // largeur visible de la section
    minX = Math.min(0, availableWidth - rowWidth - 24);
  }
  computeBounds();
  window.addEventListener('resize', computeBounds);

  function applyTransform(){
    viewport.style.transform = 'translate3d(' + posX + 'px,0,0)';
  }

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  function stopMomentum(){
    if (momentumFrame){ cancelAnimationFrame(momentumFrame); momentumFrame = null; }
  }

  function runMomentum(){
    velocity *= 0.92;
    posX = clamp(posX + velocity, minX, 0);
    applyTransform();
    if (Math.abs(velocity) > 0.4 && posX > minX && posX < 0){
      momentumFrame = requestAnimationFrame(runMomentum);
    }
  }

  if (isFinePointer){
    viewport.addEventListener('pointerdown', e => {
      if (e.button !== undefined && e.button !== 0) return;
      isDragging = true;
      moved = 0;
      stopMomentum();
      startClientX = lastClientX = e.clientX;
      startPosX = posX;
      lastTime = performance.now();
      velocity = 0;
      viewport.classList.add('dragging');
      viewport.setPointerCapture(e.pointerId);
    });

    viewport.addEventListener('pointermove', e => {
      if (!isDragging) return;
      const dx = e.clientX - startClientX;
      moved = Math.max(moved, Math.abs(dx));
      posX = clamp(startPosX + dx, minX, 0);
      applyTransform();

      const now = performance.now();
      const dt = now - lastTime;
      if (dt > 0){
        velocity = (e.clientX - lastClientX) / dt * 16;
        lastTime = now;
        lastClientX = e.clientX;
      }
    });

    function endDrag(e){
      if (!isDragging) return;
      isDragging = false;
      viewport.classList.remove('dragging');
      if (Math.abs(velocity) > 0.5) runMomentum();

      if (moved < 6){
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const card = el && el.closest('.card');
        if (card) toggleCard(card);
      }
      refreshChipLabel();
    }
    viewport.addEventListener('pointerup', endDrag);
    viewport.addEventListener('pointercancel', endDrag);

    viewport.addEventListener('wheel', e => {
      if (Math.abs(e.deltaX) < Math.abs(e.deltaY)) return;
      e.preventDefault();
      stopMomentum();
      posX = clamp(posX - e.deltaX, minX, 0);
      applyTransform();
    }, { passive:false });
  } else {
    /* pointeurs tactiles : défilement natif (voir CSS) + tap pour ouvrir */
    let touchStartX = 0, touchMoved = 0;
    viewport.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchMoved = 0;
    }, { passive:true });
    viewport.addEventListener('touchmove', e => {
      touchMoved = Math.max(touchMoved, Math.abs(e.touches[0].clientX - touchStartX));
    }, { passive:true });
    viewport.addEventListener('touchend', e => {
      if (touchMoved < 6){
        const card = e.target.closest('.card');
        if (card) toggleCard(card);
      }
    });
  }
})();
</script>

</body>
</html>
